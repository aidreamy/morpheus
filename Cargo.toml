[workspace]
members = ["crates/morpheus-agents",
  "crates/morpheus-onnx",
  "crates/morpheus-recall",
  "crates/morpheus-sdk",
  "crates/morpheus-tools",
  "crates/morpheus-tui",
  "crates/morpheus-whatsapp",
]

[features]
gui = ["dep:gpui", "dep:pulldown-cmark", "dep:unicode-segmentation"]
embed = ["morpheus-tools/embed", "fastembed"]
lancedb = ["morpheus-recall/lancedb"]
fastembed = ["morpheus-recall/fastembed", "dep:fastembed"]
cloud = ["morpheus-recall/cloud"]
# The ONNX decision engine (morpheus-onnx): gates the heavy ONNX runtime
# (`ort`/`tokenizers`) out of the dependency graph. Without it the binary
# never links ONNX Runtime and the harness compiles the Checkup trait only.
onnx = ["dep:morpheus-onnx"]
# Local voice output (`src/speak`). Gates `sherpa-onnx`, which statically
# links ONNX Runtime, out of the default build for the same reason `onnx`
# exists: a plain build must not carry the runtime.
speak = ["dep:sherpa-onnx"]
# The advanced text frontend: `piper-phonemize` (espeak-ng) phonemizes in
# Rust for the Kokoro languages sherpa-onnx ships no lexicon for (pt-br,
# es, fr, ...). That crate is GPL-3.0-or-later and adds an espeak-ng
# build dependency, so it stays opt-in.
speak-phonemize = ["speak", "dep:piper-phonemize", "dep:sabiyomi"]

[package]
description = "Morpheus - coding agent for the terminal"
edition = "2024"
license = "GPL-3.0-only"
name = "morpheus"
readme = "README.md"
repository = "https://github.com/aidreamy/morpheus"
version = "1.0.3"
keywords = ["terminal", "cli"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.morpheus-recall]
path = "crates/morpheus-recall"
version = "0.1.5"

[dependencies.morpheus-tools]
path = "crates/morpheus-tools"
version = "0.1.6"

[dependencies.morpheus-agents]
path = "crates/morpheus-agents"
version = "0.1.0"

[dependencies.morpheus-onnx]
path = "crates/morpheus-onnx"
version = "0.1.5"
optional = true

# Kokoro TTS through sherpa-onnx's safe Rust API. Default features link a
# prebuilt static sherpa-onnx archive (downloaded by its build script).
[dependencies.sherpa-onnx]
version = "2.0.2"
optional = true

# External phonemizer for the `speak-phonemize` feature. GPL-3.0-or-later.
[dependencies.piper-phonemize]
version = "1.5.9"
optional = true

# Japanese readings (kanji -> kana) for the Japanese frontend. The IPADIC
# dictionary is embedded in the binary, so no download or setup is needed.
[dependencies.sabiyomi]
version = "0.1.0"
optional = true

[dependencies.morpheus-tui]
path = "crates/morpheus-tui"
version = "0.1.6"

[dependencies.morpheus-whatsapp]
path = "crates/morpheus-whatsapp"
version = "0.1.0"

[dependencies.fastembed]
# Pinned to 7: it selects `ort =2.0.0-rc.13` (ndarray, std, api-24), matching
# morpheus-onnx so the workspace builds a single ort.
version = "7"
optional = true

[[bin]]
name = "morpheus"
path = "src/tui/main.rs"

[[bin]]
name = "morpheus-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[[bin]]
name = "morpheus-uninstall"
path = "src/bin/morpheus_uninstall.rs"

[[bin]]
name = "highlight-demo"
path = "src/bin/highlight_demo.rs"

# Manual voice harness for `src/speak` (`cargo speak pt-br -t "..."`). It
# needs the phonemizer: only English and Chinese have a lexicon in the Kokoro
# bundles, and the other seven languages go through espeak-ng.
[[bin]]
name = "speak"
path = "src/bin/speak.rs"
required-features = ["speak-phonemize"]

# The decision daemon, gated on the same feature as the ONNX runtime: the
# daemon exists only when the model does, and without `onnx` the binary is
# never built at all.
[[bin]]
name = "morpheus-decisiond"
path = "src/daemon/decision/main.rs"
required-features = ["onnx"]

# The voice daemon exists only when a TTS backend does; the binary is never
# built in a default build.
[[bin]]
name = "morpheus-ttsd"
path = "src/daemon/tts/main.rs"
required-features = ["speak"]

# ---
[dependencies]
gpui = { version = "0.2.2", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
unicode-segmentation = { version = "1", optional = true }
serde_json = "1.0"
aiface = "0.3.1"
morpheus-sdk = { path = "crates/morpheus-sdk", version = "0.1.6" }
# toml = "1.1"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
dotenvy = "0.15.7"
# System-browser handoff for the Charm gateway device sign-in (same crate and
# `hardened` feature the morpheus-sdk OAuth module uses for its own flows).
webbrowser = { version = "1", features = ["hardened"] }
# Parallel cold rebuild of the session view's height cache (a left-panel
# toggle re-estimates every message height; see SessionView's width-snapshot
# logic). Same crate/version the workspace already uses in morpheus-sdk.
rayon = "1"
# Reused workspace-wide at these exact versions (see crates/morpheus-sdk,
# crates/morpheus-tools, crates/morpheus-recall): error enums, header maps, URL
# parsing for the MCP client. Not new crates, just newly direct.
thiserror = "2"
# The activation lock (`flock`) that serializes daemon bind races on Unix -
# see `daemon::activation`. Same crate/version morpheus-tools already carries.
libc = "0.2"
http = "1"
url = "2"
# GitHub release check for the home update banner (same crate/version the
# morpheus-sdk connector already uses for its catalog fetches).
reqwest = { version = "0.13", features = ["json", "blocking"] }
# Kokoro bundles are published as `.tar.bz2`; the download router unpacks them
# in-process. Both crates are already in the workspace graph, and bzip2's
# default feature is the pure-Rust decoder (no system libbz2 to link).
tar = "0.4"
bzip2 = "0.6"
tempfile = "3"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
directories = "6.0.0"
regex = "1"
# Image decoding for prompt image previews (thumbnails).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tiktoken-rs = "0.12.0"
# `v1` is keyring's whole default surface (the Entry/Error API used by
# `src/mcp/auth.rs`); it already pulls the Apple, Windows and zbus secret
# service stores, all of which are target-gated to their own OS. Listing them
# again only duplicates what `v1` implies.
keyring = { version = "4.1.6", features = ["v1"] }

# ---
# Display-width measurement for the footer (already a transitive dependency
# of ratatui; promoted to direct use for right-anchored segments).
[dependencies.unicode-width]
version = "0.2"

# ---
[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# ---
# Explicit features instead of `full`: the TUI needs the multi-thread
# runtime, tokio's net/process/fs/signal drivers, io-util (duplex/split) and
# the time/sync primitives. `full` additionally turns on `io-std` and the
# `parking_lot` allocator hook, neither of which any call site uses.
[dependencies.tokio]
version = "1"
features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
]

[dependencies.serde]
version = "1"
features = ["derive", "rc"]

# `server` is intentionally absent: Morpheus only *consumes* MCP servers, so
# the server half of rmcp (schemars, uuid, pastey, async-rw transport) is only
# needed by the fake servers in `src/mcp/test/`. It is re-enabled from
# dev-dependencies below, which keeps it out of the release binary.
[dependencies.rmcp]
version = "3.2.0"
features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3", "xxh32", "xxh64"]

# OS entropy for telemetry identifiers (audit F04): no time/address-derived
# fallbacks - when entropy is unavailable the telemetry event is dropped.
[dependencies.getrandom]
version = "0.3"

[dependencies.arboard]
version = "3"
default-features = false
# `image-data` lets Ctrl+V read an image copied to the clipboard (a screenshot,
# a copied picture) instead of only its text representation.
features = ["image-data"]

[dependencies.open]
version = "5"
[dependencies.notify-rust]
version = "4"

[target.'cfg(windows)'.dependencies]
# `LockFileEx` is the Windows `flock` equivalent for the daemon activation
# lock; `OVERLAPPED` lives in System::IO.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }
# AF_UNIX sockets on Windows (`daemon::transport`). The API mirrors
# `std::os::unix::net`, and mio already pulls this crate in, so it is not a
# new artifact in the graph. Requires Windows 10 1803+ / Server 2019+.
uds_windows = "1.2.1"

[dependencies.lru]
version = "0.18"

# ---
[dev-dependencies]
parking_lot = "0.12"

# The MCP integration tests stand up in-process rmcp servers
# (`src/mcp/test/manager_support.rs`), so only test builds need `server`.
# Features unify with the client-only normal dependency above.
rmcp = { version = "3.2.0", default-features = false, features = ["server"] }

# In-process loopback TLS fixture for the telemetry transport tests (no
# external process, no Python, no openssl CLI).
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Performance profiles
# The TUI's hot path lives almost entirely in dependencies (tree-sitter,
# unicode-width, ratatui, pulldown-cmark, regex, taffy). Unoptimized, those
# make every frame 20-100x slower - a debug `target/debug/morpheus` measured
# 127ms/frame with an active tool spinner vs 2.7ms optimized, which is the
# source of the "TUI freezes while the agent works" reports.
#
# Keep morpheus's own crates unoptimized (fast iteration, real line numbers) but
# build every dependency with full optimizations in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
# Ship symbols-free binaries: nothing in the shipped build consumes debuginfo
# or ELF/Mach-O symbols (panics report source locations compiled into the
# binary, and the telemetry path has no backtrace capture), so the symbol
# tables are pure download weight. `debug` already defaults to 0; `strip`
# additionally drops the symbol table that rustc otherwise emits.
strip = "symbols"

# ___
[workspace.lints.clippy]
perf = "deny"

# Shared dependency declarations
# Single source of truth for cross-crate dependencies. Crates opt in with
# `<dep>.workspace = true`; pre-existing inline versions keep working until
# they are migrated one crate at a time.
[workspace.dependencies]
lsp-types = "0.97"

# Patches
# Real bracketed paste on Windows (`Event::Paste`, atomic placeholder, zero
# streaming heuristics): stock crossterm 0.29 cannot decode bracketed paste
# from `ReadConsoleInput` (crossterm-rs/crossterm#737), and requesting the
# mode even corrupts pasted newlines into Ctrl+Enter (#962). eitsupi's
# VT-input hybrid (upstream PR crossterm-rs/crossterm#1030, manually
# validated on Windows Terminal + modern conhost, already adopted via patch
# by helix, yazi and codex) scopes ENABLE_VIRTUAL_TERMINAL_INPUT to the
# bracketed-paste lifetime, so pastes arrive as one `Event::Paste` exactly
# like on Unix. Pinned by rev for reproducibility - drop this section once
# upstream merges and releases. Consoles without VT input (legacy conhost)
# keep the old VK-record stream, still covered by the paste-burst coalescer
# fallback in `src/tui/app/paste_burst.rs`.
[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm", rev = "94ed7154e35d24a2f643c61760e1eb05b8ca9e63" }

# GPUI 0.2.2's XIM client uses xim-ctext 0.3.0, which rejects unescaped
# Latin-1 COMPOUND_TEXT from X11 input methods. Use Zed's corrected decoder
# until GPUI pulls in the fix through its published dependencies.
xim-ctext = { git = "https://github.com/zed-industries/xim-rs", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8" }
